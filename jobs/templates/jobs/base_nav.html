<style>
  *, *::before, *::after {
    box-sizing: border-box;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    margin: 0;
    background: #f4f6f9;
    color: #1f2937;
  }
  .nav {
    background: #111827;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .nav-brand {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .nav-links a {
    color: #d1d5db;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
  }
  .nav-links a:hover,
  .nav-links a.active {
    background: #2563eb;
    color: #fff;
  }
  .container {
    max-width: 1100px;
    margin: 28px auto;
    padding: 0 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    margin-bottom: 24px;
  }
  .card h2 {
    margin-top: 0;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 820px) {
    .grid-2,
    .grid-3 {
      grid-template-columns: 1fr;
    }
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 14px;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="number"],
  input[type="file"],
  select,
  textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
  }
  textarea {
    min-height: 120px;
    resize: vertical;
  }
  .btn {
    margin-top: 14px;
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover {
    background: #1d4ed8;
  }
  .alert-error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .alert-success {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th,
  td {
    text-align: left;
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
    vertical-align: top;
    font-size: 14px;
  }
  th {
    background: #f9fafb;
    font-weight: 700;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    background: #dcfce7;
    color: #166534;
  }
  .tag {
    display: inline-block;
    background: #eff6ff;
    color: #1e40af;
    padding: 2px 8px;
    border-radius: 4px;
    margin: 2px;
    font-size: 12px;
  }
  .tag-miss {
    background: #f3f4f6;
    color: #4b5563;
  }
</style>

<nav class="nav">
  <a href="/result-filter/" class="nav-brand">Job Portal ATS</a>
  <div class="nav-links">
    <a href="/jd/" class="{% if active_page == 'jd' %}active{% endif %}">1. Job Description</a>
    <a href="/upload-resume/" class="{% if active_page == 'upload' %}active{% endif %}">2. Candidate Upload</a>
    <a href="/result-filter/" class="{% if active_page == 'filter' %}active{% endif %}">3. Result Filter</a>
    <a href="/api/docs/">API Docs</a>
  </div>
</nav>
