<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Job Description</title>
</head>
<body>
  {% include "jobs/base_nav.html" %}
  <div class="container">
    {% if errors %}
      <div class="alert-error">
        <strong>Error:</strong>
        <ul style="margin: 6px 0 0 18px;">
          {% for err in errors %}<li>{{ err }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <div class="card">
      <h2>Edit Job Description: {{ jd_obj.title }}</h2>
      <form method="post">
        {% csrf_token %}
        <div class="grid-3">
          <div>
            <label for="id_title">Job Title *</label>
            <input type="text" id="id_title" name="title" value="{{ form_data.title }}" required />
          </div>
          <div>
            <label for="id_company_name">Company Name</label>
            <input type="text" id="id_company_name" name="company_name" value="{{ form_data.company_name }}" />
          </div>
          <div>
            <label for="id_min_experience">Minimum Experience (Years)</label>
            <input type="number" step="0.5" min="0" id="id_min_experience" name="min_experience" value="{{ form_data.min_experience }}" />
          </div>
        </div>

        <div style="margin-top: 14px;">
          <label for="id_required_skills">Key Skills</label>
          <input type="text" id="id_required_skills" name="required_skills" value="{{ form_data.required_skills }}" />
        </div>

        <div style="margin-top: 14px;">
          <label for="id_description">Full Job Description *</label>
          <textarea id="id_description" name="description" required>{{ form_data.description }}</textarea>
        </div>

        <button type="submit" class="btn">Update JD</button>
        <a href="/jd/" style="margin-left: 12px;">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
